[pytest]
# 用例发现范围与命名规则：在项目根目录直接执行 pytest 即可
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 把项目根目录加入模块搜索路径，使 tests 内可以 import utils 包
pythonpath = .

# 默认执行参数：
# -v 详细输出；--tb=short 精简回溯；-ra 末尾用例结果摘要
# --reruns 2 网络类失败自动重试 2 次，--reruns-delay 1 每次间隔 1s
# --only-rerun 用正则限定只重试网络抖动异常（Timeout 可同时覆盖
#   ConnectTimeout/ReadTimeout）；断言失败 AssertionError 不重试，避免掩盖真实缺陷
addopts =
    -v
    --tb=short
    -ra
    --reruns 2
    --reruns-delay 1
    --only-rerun Timeout|ConnectionError|SSLError|ChunkedEncodingError

# 实时日志：运行时直接看到每个请求的方法、URL、状态码、耗时
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)-5s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S

# 自定义标记：local 用例依赖本地 FastAPI 服务，仅在 --env=dev 时运行
markers =
    local: 依赖本地 FastAPI 被测服务的用例（pytest --env=dev）
