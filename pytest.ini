[pytest]
# 用例发现范围与命名规则：在项目根目录直接执行 pytest 即可
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 把项目根目录加入模块搜索路径，使 tests 内可以 import utils 包
pythonpath = .

# 默认执行参数：详细输出 + 精简回溯 + 末尾用例结果摘要
addopts = -v --tb=short -ra

# 实时日志：运行时直接看到每个请求的方法、URL、状态码、耗时
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)-5s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S
